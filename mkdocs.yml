site_name: Dango
site_description: "Open-source Discord AI bot — connect Gemini, GPT-4o, Claude, Llama, or Ollama to your Discord server in minutes. Web UI setup, slash commands, tools, and no restarts needed."
site_url: https://zhiro-labs.github.io/dango
repo_url: https://github.com/zhiro-labs/dango
repo_name: zhiro-labs/dango
site_author: zhiro-labs
copyright: "© 2025 zhiro-labs · <a href='https://github.com/zhiro-labs/dango/blob/main/LICENSE'>MIT License</a>"

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - tags
  - copy-to-llm:
      repo_url: "https://raw.githubusercontent.com/zhiro-labs/dango/main"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhiro-labs/dango
      name: Dango on GitHub

nav:
  - Home: index.md
  - Getting Started:
    - Discord Setup: getting-started/discord-setup.md
    - Docker (Recommended): getting-started/docker.md
    - uv (Developers): getting-started/uv.md
  - Configuration:
    - Environment Variables: configuration/env-vars.md
    - Runtime Config: configuration/runtime.md
  - Features:
    - Model Providers & Routing: features/models.md
    - Tools: features/tools.md
    - Workflow Architecture: features/workflow.md
  - Usage:
    - Slash Commands: usage/commands.md
    - Conversations: usage/conversations.md
  - Advanced:
    - Embedding into Another Bot: advanced/embedding.md
    - VPS Deployment: advanced/vps.md
  - Reference:
    - API Reference: reference/api.md
    - Troubleshooting: troubleshooting.md
    - Tags: tags.md
