name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Runs only on the upstream repo. Forks: change the owner below to your own
    # account/org to enable publishing to ghcr.io/<your-namespace>/dango.
    if: github.repository_owner == 'zhiro-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Derives the image name from the current repo, so forks publish to
          # their own namespace automatically once the job is enabled.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
