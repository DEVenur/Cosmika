name: dango

services:
  web:
    build: .
    entrypoint: []
    command: uv run uvicorn web.main:app --host 0.0.0.0 --port 17860
    environment:
      - WEB_PORT=17860
    ports:
      - "17860:17860"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  bot:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - fonts:/app/assets/fonts
      - ./workspace:/app/workspace
    restart: unless-stopped

volumes:
  fonts:
