{% extends "base.html" %}
{% block title %}System Prompt — Dango{% endblock %}
{% block content %}

<div class="p-8 max-w-3xl flex flex-col gap-6">

  <h1 class="text-xl font-bold flex items-center gap-2.5">
    <span class="w-1 h-5 bg-primary rounded-full flex-shrink-0"></span>
    System Prompt
  </h1>

  <div class="card bg-base-100 shadow-sm">
    <div class="card-body gap-4">

      <div>
        <h2 class="font-semibold text-sm">Chat System Prompt</h2>
        <p class="text-xs text-base-content/45 mt-0.5">Defines the bot's personality and response style. Applied to every conversation.</p>
      </div>

      <form hx-post="/api/config/prompt" hx-target="#prompt-status" hx-swap="innerHTML">
        <textarea
          id="chat-sys-prompt"
          name="chat_sys_prompt"
          data-default="You are Dango, a helpful AI assistant on this Discord server. Always be polite and positive in your responses."
          class="textarea textarea-bordered w-full h-72 resize-y text-sm leading-relaxed font-mono"
        >{{ config.chat_sys_prompt }}</textarea>
        <div class="flex justify-end items-center gap-3 mt-3">
          <button type="button" class="text-xs link link-hover text-base-content/40"
            onclick="document.getElementById('chat-sys-prompt').value = document.getElementById('chat-sys-prompt').dataset.default">Reset</button>
          <span id="prompt-status" class="text-sm"
            x-data
            x-on:htmx:after-swap.window="if ($event.detail.target.id === 'prompt-status') { setTimeout(() => $event.detail.target.innerHTML = '', 4000) }">
          </span>
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
        </div>
      </form>

    </div>
  </div>

</div>

{% endblock %}
